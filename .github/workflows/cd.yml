name: CD Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    # Запускаем только если секреты настроены в репозитории
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "--> Вход на сервер выполнен успешно."
            # Определение пути проекта на сервере (обычно ~/Primakov_App или /opt/Primakov_App)
            if [ -d "$HOME/Primakov_App" ]; then
              APP_DIR="$HOME/Primakov_App"
            elif [ -d "/opt/Primakov_App" ]; then
              APP_DIR="/opt/Primakov_App"
            elif [ -d "$HOME/PrimakovApp" ]; then
              APP_DIR="$HOME/PrimakovApp"
            else
              echo "Папка репозитория Primakov_App не найдена в ~/ или /opt/!"
              exit 1
            fi

            cd "$APP_DIR/backend"
            echo "--> Переход в директорию: $(pwd)"
            
            # Подтягивание свежего кода
            echo "--> Обновление Git..."
            git pull origin main
            
            # Сборка и перезапуск через Docker Compose
            echo "--> Сборка и перезапуск Docker контейнеров..."
            docker compose -f docker-compose.prod.yml build backend
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Очистка старых слоев
            docker image prune -f
            
            # Проверка состояния
            echo "--> Статус запущенных контейнеров:"
            docker compose -f docker-compose.prod.yml ps
            
            echo "--> Проверка Healthcheck:"
            sleep 5
            docker compose -f docker-compose.prod.yml exec -T backend wget -qO- http://127.0.0.1:3000/health || echo "Ожидание запуска..."

