name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Базовый URL бэкенда (API_BASE_URL)'
        required: true
        default: 'https://primakov.ddns.net/api'
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build Release APK
        working-directory: flutter
        env:
          API_URL: ${{ github.event.inputs.api_base_url || 'https://primakov.ddns.net/api' }}
        run: |
          echo "Сборка APK с адресом API: $API_URL"
          flutter build apk --release --dart-define=API_BASE_URL=$API_URL

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimakovApp-release
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release (Only on Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: flutter/build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

